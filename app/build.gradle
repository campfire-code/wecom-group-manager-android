apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'

android {
    compileSdkVersion 30

    defaultConfig {
        applicationId "org.yameida.worktool"
        minSdkVersion 24
        targetSdkVersion 30
        versionCode 28012
        versionName "2.8.0-campfire.2"
    }

    // 签名只从环境变量读取；没有这些变量时 release 不签名（本机用 debug 包）
    signingConfigs {
        if (System.getenv("ANDROID_KEYSTORE_FILE") && System.getenv("ANDROID_KEYSTORE_PASSWORD")
                && System.getenv("ANDROID_KEY_ALIAS") && System.getenv("ANDROID_KEY_PASSWORD")) {
            release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName('release') != null) signingConfig signingConfigs.release
        }
    }
    // 上游 targetSdk 30 过期会让 lintVital 拦住 release 构建；本分支不改 targetSdk，避免改变无障碍与后台行为
    lint {
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation project(':baselibrary')
    implementation project(':floatwindow')
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])

    //友盟统计SDK
    implementation  'com.umeng.umsdk:common:9.4.7'// 必选
    implementation  'com.umeng.umsdk:asms:1.4.1'// 必选
    implementation 'com.umeng.umsdk:apm:1.5.2' // 错误分析升级为独立SDK，看crash数据请一定集成，可选
}